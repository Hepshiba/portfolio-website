<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Contact Me</h1>
</header>

<main>

<form>

<label for="name">Name</label>
<input type="text"
id="name"
aria-label="Name">

<label for="email">Email</label>
<input type="email"
id="email"
aria-label="Email">

<label for="message">Message</label>
<textarea
id="message"
aria-label="Message">
</textarea>

<button type="submit">
Send
</button>

</form>

</main>

<footer>
<p>Portfolio Website</p>
</footer>

</body>
</html>
